name: Continuous Deployment Development

on:
  push:
    branches:
      - development

jobs:
  deploy:
    name: Build Image & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: |
            dataloplatforms/signature-server:latest
            dataloplatforms/signature-server:${{ github.sha }}

      - name: Disparar despliegue en Dokploy
        run: |
          echo "Enviando solicitud de despliegue a Dokploy..."
          RESPONSE=$(curl -s -X POST "https://dokploy.data-lo.online/api/deploy/compose/nhI-aPDgdpE_h_OzCnzV-")
          echo "Respuesta del servidor: $RESPONSE"
          echo "¡Despliegue solicitado con éxito!"
