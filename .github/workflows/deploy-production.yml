name: Deploy (Production)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión existente a desplegar (por ejemplo, v1.2.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: dataloplatforms/signature-server

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.version || github.ref }}

      - name: Validate the version and its source branch
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version='${{ inputs.version || github.ref_name }}'

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "La versión debe tener el formato vMAJOR.MINOR.PATCH (ejemplo: v1.4.0)." >&2
            exit 1
          fi

          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "El release debe apuntar a un commit que ya está en main." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    name: Test and build application
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build

  deploy:
    name: Build, publish, and deploy
    needs: [validate, test]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish the release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}
            ${{ env.IMAGE_NAME }}:sha-${{ needs.validate.outputs.sha }}
            ${{ env.IMAGE_NAME }}:production
          labels: |
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}

      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_PRODUCTION_WEBHOOK: ${{ secrets.DOKPLOY_PRODUCTION_WEBHOOK }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DOKPLOY_PRODUCTION_WEBHOOK" ]]; then
            echo "DOKPLOY_PRODUCTION_WEBHOOK is missing from the production environment." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --request POST "$DOKPLOY_PRODUCTION_WEBHOOK"
