components:
  securitySchemes:
    integration-api-key:
      type: apiKey
      in: header
      name: X-API-Key
      description: |-
        API key de tu organización, con formato `fma_live_<publicId>_<secret>`. Se emite (y se rota o revoca) desde **Integraciones** en Firmalo; el secreto completo sólo se muestra al emitirla.

        Ejemplo (no es una llave real): `fma_live_0123456789abcdef_EjemploNoRealEjemploNoRealEjemploNoReal1234`

        La organización y el contexto de acceso salen de la llave: no se usan JWT, `X-Account-Id` ni `X-Organization-Id`. Llama a la API sólo desde tu backend; nunca expongas la llave en un navegador o una app móvil.
  schemas:
    CreateIntegrationDocumentDto:
      type: object
      properties:
        payload:
          description: Campo de texto con un JSON con `creator`, `document` y `participants`.
          example:
            creator:
              email: ana.lopez@cliente.example
              firstName: Ana
              lastName: López
            document:
              signatureType: SIMPLE
              isSequential: true
              isIndexable: true
            participants:
              - role: SIGNER
                firstName: Luis
                lastName: Martínez
                email: luis.martinez@correo.example
                order: 1
                signaturePositions:
                  - page: 1
                    xRatio: 0.1
                    yRatio: 0.8
                    widthRatio: 0.25
                    heightRatio: 0.08
              - role: SIGNER
                firstName: Marta
                lastName: Gómez
                email: marta.gomez@correo.example
                order: 2
                signaturePositions:
                  - page: 1
                    xRatio: 0.55
                    yRatio: 0.8
                    widthRatio: 0.25
                    heightRatio: 0.08
              - role: WITNESS
                firstName: Eva
                lastName: Ruiz
                email: eva.ruiz@correo.example
          allOf:
            - $ref: '#/components/schemas/IntegrationDocumentPayloadDto'
        file:
          type: string
          format: binary
          description: PDF del documento a firmar, como archivo binario.
      required:
        - payload
        - file
    CreateIntegrationSigningAccessDto:
      type: object
      properties:
        email:
          type: string
          example: ana@correo.com
          description: Correo del firmante
      required:
        - email
    DocumentCancelledWebhookPayload:
      type: object
