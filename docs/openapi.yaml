                  summary: Organización desactivada
                  value:
                    success: false
                    error:
                      code: API_KEY_ORGANIZATION_INACTIVE
                      message: La organización de esta API key está desactivada
        '404':
          description: '`INTEGRATION_SIGNER_NOT_FOUND`: el documento no es de la organización o ningún firmante tiene ese correo'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationErrorResponseDto'
              examples:
                signerNotFound:
                  summary: Firmante no encontrado
                  value:
                    success: false
                    error:
                      code: INTEGRATION_SIGNER_NOT_FOUND
                      message: No existe ese firmante en un documento de la organización
        '409':
          description: '`WAITING_FOR_PREVIOUS_SIGNER` (no es su turno), `INTEGRATION_AMBIGUOUS_SIGNER` (más de un firmante con ese correo) o `INTEGRATION_INVITATION_NOT_RESENDABLE` (ya no espera esa firma o firma desde su cuenta)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationErrorResponseDto'
              examples:
                notInTurn:
                  summary: No es su turno
                  value:
                    success: false
                    error:
                      code: WAITING_FOR_PREVIOUS_SIGNER
                      message: 'Todavía no es el turno de este firmante: falta la firma de un firmante anterior'
                ambiguous:
                  summary: Correo de más de un firmante
                  value:
                    success: false
                    error:
                      code: INTEGRATION_AMBIGUOUS_SIGNER
                      message: El correo corresponde a más de un firmante del documento
                notResendable:
                  summary: El firmante ya no espera firma
                  value:
                    success: false
                    error:
                      code: INTEGRATION_INVITATION_NOT_RESENDABLE
                      message: El documento ya no espera la firma de este firmante
        '422':
          description: '`INVALID_REQUEST`: `email` no es un correo válido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationErrorResponseDto'
              examples:
                invalidRequest:
                  summary: Campos inválidos
                  value:
                    success: false
                    error:
                      code: INVALID_REQUEST
                      message: La petición tiene campos inválidos.
                      details:
                        errors:
                          - email debe ser un correo válido
        '429':
          description: '`TOO_MANY_REQUESTS`: se superaron los diez accesos en 10 minutos para ese firmante.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationErrorResponseDto'
              examples:
                tooManyRequests:
                  summary: Demasiadas solicitudes para el firmante
                  value:
                    success: false
                    error:
                      code: TOO_MANY_REQUESTS
                      message: Demasiados intentos. Espera unos minutos antes de volver a intentarlo.
      security:
        - integration-api-key: []
      summary: Generar un acceso temporal de firma para un firmante
