                      message: 'La organización, la cuenta y el autor salen de la API key; no se aceptan: organizationId'
        '401':
          description: '`API_KEY_INVALID` (falta, formato incorrecto, secreto que no coincide o llave revocada) o `API_KEY_EXPIRED`.'
