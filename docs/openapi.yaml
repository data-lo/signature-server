    IntegrationBillingSummaryData:
      type: object
      properties:
        plan:
          type: string
          nullable: true
          example: Business
          description: Nombre del plan; `null` si la organización no tiene plan
        status:
          type: string
          enum:
            - free
            - incomplete
            - active
            - past_due
            - canceled
          nullable: true
          example: active
          description: '`null` si la organización nunca pasó por facturación'
        billingCycle:
          type: string
          enum:
            - monthly
            - yearly
            - custom
          nullable: true
          example: monthly
          description: Según la duración del periodo vigente; `custom` si no es mensual ni anual, y `null` sin periodo
        nextBillingDate:
          type: string
          format: date
          nullable: true
          example: '2026-12-01'
          description: 'Fecha de renovación (UTC); `null` si no habrá otro cobro: sin plan de pago o con la baja programada'
        paymentStatus:
          type: string
          enum:
            - paid
            - past_due
            - pending
            - not_applicable
          example: paid
          description: '`paid` (al corriente), `past_due` (cobro fallido), `pending` (contratación sin confirmar) o `not_applicable` (sin plan de pago)'
      required:
        - plan
        - status
        - billingCycle
        - nextBillingDate
        - paymentStatus
    IntegrationCreatedDocumentData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 2be3b9d7-4c5d-4e6f-8a9b-0c1d2e3f4a5b
        status:
          type: string
          enum:
            - CREATED
            - PENDING_APPROVAL
            - PENDING_SIGNATURE
            - SIGNED
            - REJECTED
            - EXPIRED
            - CANCELLATION_PENDING
            - CANCELLED
          example: PENDING_SIGNATURE
        signatureType:
          type: string
          enum:
            - SIMPLE
            - FIEL
            - BIOMETRIC
          nullable: true
          example: SIMPLE
          description: '`FIEL` es la firma avanzada'
        fileName:
          type: string
          example: contrato.pdf
        createdAt:
          format: date-time
          type: string
          example: '2026-10-26T12:00:00.000Z'
        creator:
          $ref: '#/components/schemas/IntegrationDocumentCreatorData'
        participantsCount:
          type: number
          example: 1
          description: Firmantes y testigos del documento
        publicUrl:
          type: string
          example: https://app.firmalo.com/public/documents/2be3b9d7-4c5d-4e6f-8a9b-0c1d2e3f4a5b
          description: URL pública de consulta del documento (`PUBLIC_WEB_APP_URL`)
        participants:
          description: 'Firmantes en orden de firma. No incluye URLs de firma: cada uno recibe su invitación por correo, y el portal pide un acceso temporal con `POST /integration/documents/:documentId/signing-access`.'
          type: array
          items:
            $ref: '#/components/schemas/IntegrationDocumentParticipantData'
      required:
        - id
        - status
        - signatureType
        - fileName
        - createdAt
        - creator
        - participantsCount
        - publicUrl
        - participants
    IntegrationCreatedDocumentResponse:
      type: object
      properties:
