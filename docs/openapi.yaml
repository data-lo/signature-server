                    error:
                      code: API_KEY_ORGANIZATION_INACTIVE
                      message: La organización de esta API key está desactivada
        '422':
          description: '`WEBHOOK_URL_NOT_ALLOWED` (la URL no es `https://` en el puerto 443, lleva credenciales o apunta a un host privado, reservado o que no resuelve; el motivo va en `details.reason`) o `INVALID_REQUEST` (falta `url`, `events` está vacío, repite un evento o trae uno desconocido).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationErrorResponseDto'
              examples:
                urlNotAllowed:
                  summary: URL no permitida
                  value:
                    success: false
                    error:
                      code: WEBHOOK_URL_NOT_ALLOWED
                      message: La URL del webhook debe usar https://
                      details:
                        field: url
                        reason: HTTPS_REQUIRED
        '503':
          description: '`WEBHOOK_SECRET_ENCRYPTION_UNAVAILABLE`: el servidor no puede generar secretos por ahora. Reintenta más tarde; no se guardó nada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationErrorResponseDto'
              examples:
                unavailable:
                  summary: Cifrado no disponible
                  value:
                    success: false
                    error:
                      code: WEBHOOK_SECRET_ENCRYPTION_UNAVAILABLE
                      message: La configuración de webhooks no está disponible por ahora. Vuelve a intentarlo más tarde.
      security:
        - integration-api-key: []
      summary: Crear o actualizar el endpoint de webhooks
      tags:
        - Webhooks
    delete:
      description: |-
        Deja de registrar entregas nuevas. Las ya registradas se siguen enviando. No borra la configuración ni el secreto: `PUT` lo reactiva. Repetirlo no cambia nada.

        **Permiso requerido:** `WEBHOOK.MANAGE`.

        La organización sale de la API key (`X-API-Key`): no se envía ningún identificador.
      operationId: IntegrationWebhookEndpointController_disable
      parameters: []
      responses:
        '200':
          description: 'Endpoint desactivado (`status: DISABLED`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationWebhookEndpointResponse'
        '400':
          description: '`INTEGRATION_TENANT_OVERRIDE_NOT_ALLOWED`: la petición trae `organizationId`, `taxId` (fuera de un participante), `userId`, `accountId`, `createdBy`, `createdByUserId`, `permissionIds`, `X-Account-Id` o `X-Organization-Id` (la organización y el autor salen de la llave). `taxId` sí se admite dentro de un participante, como RFC del firmante de firma avanzada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationErrorResponseDto'
              examples:
                tenantOverride:
                  summary: Campo de organización o autor no permitido
                  value:
                    success: false
                    error:
                      code: INTEGRATION_TENANT_OVERRIDE_NOT_ALLOWED
                      message: 'La organización, la cuenta y el autor salen de la API key; no se aceptan: organizationId'
        '401':
          description: '`API_KEY_INVALID` (falta, formato incorrecto, secreto que no coincide o llave revocada) o `API_KEY_EXPIRED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationErrorResponseDto'
              examples:
                invalid:
                  summary: Llave ausente, inválida o revocada
                  value:
                    success: false
                    error:
                      code: API_KEY_INVALID
                      message: API key inválida o revocada
                expired:
                  summary: Llave vencida
                  value:
                    success: false
                    error:
                      code: API_KEY_EXPIRED
                      message: La API key venció. Genera una nueva desde Integraciones.
        '403':
          description: '`API_KEY_PERMISSION_DENIED` (la llave no está autorizada para la operación), `API_KEY_ORGANIZATION_INACTIVE` o `API_KEY_ACTOR_INACTIVE` (quien emitió la llave ya no es miembro activo).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationErrorResponseDto'
              examples:
                permissionDenied:
                  summary: Operación no autorizada
                  value:
                    success: false
                    error:
                      code: API_KEY_PERMISSION_DENIED
                      message: La API key no está autorizada para esta operación
                organizationInactive:
                  summary: Organización desactivada
                  value:
                    success: false
                    error:
                      code: API_KEY_ORGANIZATION_INACTIVE
                      message: La organización de esta API key está desactivada
        '404':
          description: '`WEBHOOK_ENDPOINT_NOT_FOUND`: la organización no tiene un endpoint configurado. Créalo con `PUT`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationErrorResponseDto'
              examples:
                notFound:
                  summary: Sin endpoint
                  value:
                    success: false
                    error:
                      code: WEBHOOK_ENDPOINT_NOT_FOUND
                      message: La organización no tiene un endpoint de webhooks configurado
      security:
        - integration-api-key: []
      summary: Desactivar el endpoint de webhooks
      tags:
        - Webhooks
