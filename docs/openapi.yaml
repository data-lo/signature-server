        '403':
          description: '`API_KEY_PERMISSION_DENIED` (la llave no está autorizada para la operación), `API_KEY_ORGANIZATION_INACTIVE` o `API_KEY_ACTOR_INACTIVE` (quien emitió la llave ya no es miembro activo). Este endpoint exige `DOCUMENT.READ` con alcance `ORGANIZATION`; con alcance `OWN` responde `API_KEY_PERMISSION_DENIED`.'
