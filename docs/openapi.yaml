openapi: 3.0.0
info:
  title: Firmalo Integration API
  description: |-
    API para que tu sistema cree documentos PDF con su flujo de firmas, consulte su estado y gestione el acceso de los firmantes en Firmalo.

    **Autenticación.** Todas las rutas usan la API key de tu organización en el header `X-API-Key`, con formato `fma_live_<publicId>_<secret>`. Pégala en «Authorize» para probar desde esta página. Ejemplo (no es una llave real):

    `X-API-Key: fma_live_0123456789abcdef_EjemploNoRealEjemploNoRealEjemploNoReal1234`

    **Idempotencia.** `POST /integration/documents` exige `Idempotency-Key`: repetir la petición con la misma clave y el mismo contenido devuelve el documento original, sin crear ni cobrar otro. Ejemplo:

    `Idempotency-Key: erp-contrato-2026-000184`

    **Errores.** Todos tienen la forma `{ "success": false, "error": { "code", "message", "details" } }`, con un `code` estable para decidir qué hacer sin depender del texto.
  version: 1.0.0
tags:
  - name: Integration Documents
    description: Documentos, firmantes y accesos de firma de tu organización
  - name: Organización
    description: La organización de la API key, su saldo de documentos, su plan y su ciclo de facturación
  - name: Webhooks
    description: |-
      Firmalo envía un `POST` firmado a la URL de tu organización cuando cambia el estado de firma de un documento creado por la API de integración. Configura la URL y los eventos con estos endpoints; los cuerpos de cada evento están en la pestaña **Callbacks** de `PUT /api/v1/integration/webhooks/endpoint`.

      **Eventos.** `document.collaborator_signed` (un participante firmó), `document.signed` (todos los firmantes completaron el documento), `document.rejected` (un firmante rechazó) y `document.cancelled` (se confirmó la cancelación). La última firma genera `document.collaborator_signed` y `document.signed` como dos eventos independientes; el orden de llegada no está garantizado.

      **Headers.** `X-Signature-Webhook-Id` (identificador de la entrega, igual en todos sus reintentos), `X-Signature-Event` (el `type` del evento), `X-Signature-Timestamp` (segundos Unix del momento en que se firmó ese intento) y `X-Signature-Hmac` (firma en hexadecimal minúsculo, 64 caracteres). También `Content-Type: application/json` y `User-Agent: Firmalo-Webhooks/1.0`.

      **Firma.** `X-Signature-Hmac = hex(HMAC-SHA256(secret, timestamp + "." + rawBody))`, con el secreto completo (`whsec_` incluido) en UTF-8, el texto exacto de `X-Signature-Timestamp` y los bytes exactos del cuerpo recibido. Para verificar: lee el cuerpo **crudo** antes de parsear el JSON; rechaza si falta un header o si el timestamp difiere más de 5 minutos de tu reloj; calcula la firma y compárala en tiempo constante.

      **Entrega y reintentos.** Cualquier `2xx` confirma la entrega; las redirecciones no se siguen y cuentan como fallo. Cada intento espera 10 s. Ante un error de red, un timeout o una respuesta distinta de `2xx` se reintenta: 8 intentos en total (inmediato y a 1 min, 5 min, 30 min, 2 h, 5 h, 10 h y 10 h, algo más de 24 h). Cada reintento lleva un timestamp y una firma nuevos. Agotados, la entrega queda fallida.

      **Al menos una vez.** Una entrega puede llegar repetida o fuera de orden. Deduplica por `id` del payload (mismo evento) o por `X-Signature-Webhook-Id` (misma entrega). Responde `2xx` rápido y procesa después.

      **Secreto.** Se entrega sólo al crear el endpoint y al rotarlo; ninguna consulta lo vuelve a mostrar. Tras rotar, las entregas ya registradas se siguen firmando con el secreto anterior hasta terminar: acepta ambos durante 24 h.

      **Datos que nunca viajan.** PDF ni su contenido, URLs del archivo, API keys, tokens de firma o invitación, certificados, contraseñas, IP, geolocalización, imágenes o evidencia de firma, datos biométricos, nombre del archivo, motivos escritos de rechazo o cancelación, datos de otros participantes ni datos de pago.
security:
  - integration-api-key: []
paths:
  /api/v1/integration/documents:
    get:
      description: Devuelve una página (de 1 a 100, 25 por omisión) de documentos de la organización de la API key. Con `creatorEmail`, devuelve sólo los documentos creados por ese miembro. Filtrable por estatus y fechas. No incluye la URL del archivo ni datos de colaboradores.
      operationId: IntegrationDocumentsController_listOrganizationDocuments
      parameters:
        - name: statuses
          required: false
          in: query
          description: Uno o varios estatus del documento. Repetible (`?statuses=pending&statuses=signed`) o separado por comas.
          schema:
            type: array
            items:
              type: string
              enum:
                - CREATED
                - PENDING_APPROVAL
                - PENDING_SIGNATURE
                - SIGNED
                - REJECTED
                - EXPIRED
                - CANCELLATION_PENDING
                - CANCELLED
        - name: createdFrom
          required: false
          in: query
          description: Creados desde (ISO 8601)
          schema:
            example: '2026-01-01'
            type: string
        - name: createdTo
          required: false
          in: query
          description: Creados hasta (ISO 8601)
          schema:
            example: '2026-12-31'
            type: string
        - name: signedFrom
          required: false
          in: query
          description: Firmados desde (ISO 8601)
          schema:
            example: '2026-01-01'
            type: string
        - name: signedTo
          required: false
          in: query
          description: Firmados hasta (ISO 8601)
          schema:
            example: '2026-12-31'
            type: string
        - name: sortBy
          required: false
          in: query
          description: Campo por el que se ordena. Lista cerrada, no un nombre de columna.
          schema:
            default: createdAt
            enum:
              - createdAt
              - signedAt
              - fileName
              - status
            type: string
        - name: sortDirection
          required: false
          in: query
          schema:
            default: DESC
            enum:
              - ASC
              - DESC
            type: string
        - name: page
          required: false
          in: query
          description: Página
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Resultados por página
          schema:
            minimum: 1
            maximum: 100
            default: 25
            type: number
        - name: creatorEmail
          required: false
          in: query
          description: Correo del creador. Sólo documentos que creó ese miembro de la organización de la API key.
          schema:
            example: ana@acme.mx
            type: string
      responses:
        '200':
          description: Página de documentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationDocumentsPageResponse'
              example:
                success: true
                message: Documentos obtenidos correctamente
                data:
                  items:
                    - id: 7d1f2a3b-4c5d-4e6f-8a9b-0c1d2e3f4a5b
                      fileName: contrato.pdf
                      status: PENDING_SIGNATURE
                      signatureType: SIMPLE
                      createdAt: '2026-10-26T12:00:00.000Z'
                      signedAt: null
                  pagination:
                    page: 1
                    limit: 25
                    total: 1
                    totalPages: 1
        '400':
          description: '`INTEGRATION_TENANT_OVERRIDE_NOT_ALLOWED`: la petición trae `organizationId`, `taxId` (fuera de un participante), `userId`, `accountId`, `createdBy`, `createdByUserId`, `permissionIds`, `X-Account-Id` o `X-Organization-Id` (la organización y el autor salen de la llave). `taxId` sí se admite dentro de un participante, como RFC del firmante de firma avanzada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationErrorResponseDto'
              examples:
                tenantOverride:
                  summary: Campo de organización o autor no permitido
                  value:
                    success: false
                    error:
                      code: INTEGRATION_TENANT_OVERRIDE_NOT_ALLOWED
                      message: 'La organización, la cuenta y el autor salen de la API key; no se aceptan: organizationId'
        '401':
          description: '`API_KEY_INVALID` (falta, formato incorrecto, secreto que no coincide o llave revocada) o `API_KEY_EXPIRED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationErrorResponseDto'
              examples:
                invalid:
                  summary: Llave ausente, inválida o revocada
                  value:
                    success: false
                    error:
                      code: API_KEY_INVALID
                      message: API key inválida o revocada
                expired:
                  summary: Llave vencida
                  value:
                    success: false
                    error:
                      code: API_KEY_EXPIRED
                      message: La API key venció. Genera una nueva desde Integraciones.
        '403':
          description: '`API_KEY_PERMISSION_DENIED` (la llave no está autorizada para la operación), `API_KEY_ORGANIZATION_INACTIVE` o `API_KEY_ACTOR_INACTIVE` (quien emitió la llave ya no es miembro activo). También puede devolver `INTEGRATION_SCOPE_DENIED` si la llave no tiene acceso a los documentos solicitados.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationErrorResponseDto'
              examples:
                permissionDenied:
                  summary: Operación no autorizada
                  value:
                    success: false
                    error:
                      code: API_KEY_PERMISSION_DENIED
                      message: La API key no está autorizada para esta operación
                organizationInactive:
                  summary: Organización desactivada
                  value:
                    success: false
                    error:
                      code: API_KEY_ORGANIZATION_INACTIVE
                      message: La organización de esta API key está desactivada
                scopeDenied:
                  summary: Alcance insuficiente
                  value:
                    success: false
                    error:
                      code: INTEGRATION_SCOPE_DENIED
                      message: La API key sólo puede consultar los documentos de su propio usuario
        '404':
          description: '`INTEGRATION_USER_NOT_FOUND`: `creatorEmail` no es de un miembro activo de la organización'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationErrorResponseDto'
              examples:
                userNotFound:
                  summary: Usuario fuera de la organización
                  value:
                    success: false
                    error:
                      code: INTEGRATION_USER_NOT_FOUND
                      message: El usuario no existe en la organización
        '409':
          description: '`INTEGRATION_AMBIGUOUS_USER`: `creatorEmail` corresponde a más de un miembro de la organización'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationErrorResponseDto'
              examples:
                ambiguousUser:
                  summary: Correo de más de un usuario
                  value:
                    success: false
                    error:
                      code: INTEGRATION_AMBIGUOUS_USER
                      message: El correo corresponde a más de un usuario de la organización
        '422':
          description: '`INVALID_REQUEST`: algún filtro es inválido (`page`, `limit` mayor que 100, estatus o fechas).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationErrorResponseDto'
              examples:
                invalidRequest:
                  summary: Campos inválidos
                  value:
                    success: false
                    error:
                      code: INVALID_REQUEST
                      message: La petición tiene campos inválidos.
                      details:
                        errors:
                          - limit must not be greater than 100
      security:
        - integration-api-key: []
      summary: Listar los documentos de la organización
      tags:
        - Integration Documents
    post:
      description: |-
        Es `multipart/form-data` con dos campos: `file` (el PDF, binario) y `payload` (texto con un JSON con `creator`, `document` y `participants`; su estructura es `IntegrationDocumentPayloadDto`).

        La organización sale de la API key. El creador se identifica por su correo: si es miembro de la organización se usa su cuenta; si existe sin membresía, se le crea una con el rol `INTEGRATION_DOCUMENT_CREATOR`; si no existe, se crea como usuario provisional (sin contraseña). Sus datos nunca se sobrescriben.

        Cada documento creado consume un crédito de la organización. Los participantes se invitan por correo.

        **Orden de firma.** `document.isSequential` decide si `participants[].order` es obligatorio:

        | `document.isSequential` | `SIGNER` | `WITNESS` |
        | --- | --- | --- |
        | `true` o se omite | `order` obligatorio: firman uno a la vez | No requiere `order` ni participa en él |
        | `false` | `order` no es obligatorio: firman en cualquier momento | No requiere `order` ni participa en él |

        En un documento secuencial, `order` es un entero que inicia en `1` y debe ser único y consecutivo entre firmantes (`1`, `2`, `3`…). Es este valor, no la posición en `participants`, lo que define el orden. Si no se cumple, la respuesta es `422` con `INVALID_SIGNING_ORDER` o `DUPLICATE_SIGNING_ORDER`.

        **RFC del firmante (`participants[].taxId`).** Sólo aplica a un `SIGNER` de un documento con `document.signatureType: ADVANCED` y es opcional:

        - Formato: RFC mexicano de 13 caracteres (persona física) o 12 (persona moral): 3 o 4 letras, fecha `AAMMDD` y homoclave de 3, p. ej. `MAGL800101AB1`. Se recortan los espacios y se pasa a mayúsculas.
        - Si viene, el titular del certificado de la e.firma con que firme tiene que tener exactamente ese RFC; si no viene, se compara el nombre del participante con el del certificado.
        - En un `WITNESS` o en un documento `SIMPLE` o `BIOMETRIC` se rechaza con `422 PARTICIPANT_TAX_ID_NOT_ALLOWED`; con un formato inválido, `422 INVALID_PARTICIPANT_TAX_ID`.
        - El campo anterior, `rfc`, ya no forma parte del contrato: enviarlo responde `422 UNSUPPORTED_PARTICIPANT_FIELD`.

        **Ejemplo de `payload`: flujo secuencial** (dos firmantes y un testigo):

        ```json
        {
          "creator": {
            "email": "ana.lopez@cliente.example",
            "firstName": "Ana",
            "lastName": "López"
          },
          "document": {
            "signatureType": "SIMPLE",
            "isSequential": true,
            "isIndexable": true
          },
          "participants": [
            {
              "role": "SIGNER",
              "firstName": "Luis",
              "lastName": "Martínez",
              "email": "luis.martinez@correo.example",
              "order": 1,
              "signaturePositions": [
                {
                  "page": 1,
                  "xRatio": 0.1,
                  "yRatio": 0.8,
                  "widthRatio": 0.25,
                  "heightRatio": 0.08
                }
              ]
            },
            {
              "role": "SIGNER",
              "firstName": "Marta",
              "lastName": "Gómez",
              "email": "marta.gomez@correo.example",
              "order": 2,
              "signaturePositions": [
                {
                  "page": 1,
                  "xRatio": 0.55,
                  "yRatio": 0.8,
                  "widthRatio": 0.25,
                  "heightRatio": 0.08
                }
              ]
            },
            {
              "role": "WITNESS",
              "firstName": "Eva",
              "lastName": "Ruiz",
              "email": "eva.ruiz@correo.example"
            }
          ]
        }
        ```

        **Ejemplo de `payload`: flujo no secuencial** (sin `order`):

        ```json
        {
          "creator": {
            "email": "ana.lopez@cliente.example",
            "firstName": "Ana",
            "lastName": "López"
          },
          "document": {
            "signatureType": "SIMPLE",
            "isSequential": false,
            "isIndexable": true
          },
          "participants": [
            {
              "role": "SIGNER",
              "firstName": "Luis",
              "lastName": "Martínez",
              "email": "luis.martinez@correo.example",
              "signaturePositions": [
                {
                  "page": 1,
                  "xRatio": 0.1,
                  "yRatio": 0.8,
                  "widthRatio": 0.25,
                  "heightRatio": 0.08
                }
              ]
            },
            {
              "role": "SIGNER",
              "firstName": "Marta",
              "lastName": "Gómez",
              "email": "marta.gomez@correo.example",
              "signaturePositions": [
                {
                  "page": 1,
                  "xRatio": 0.55,
                  "yRatio": 0.8,
                  "widthRatio": 0.25,
                  "heightRatio": 0.08
                }
              ]
            },
            {
              "role": "WITNESS",
              "firstName": "Eva",
              "lastName": "Ruiz",
              "email": "eva.ruiz@correo.example"
            }
          ]
        }
        ```

        **Ejemplo de `payload`: firma avanzada** (el primer firmante con `taxId`):

        ```json
        {
          "creator": {
            "email": "ana.lopez@cliente.example",
            "firstName": "Ana",
            "lastName": "López"
          },
          "document": {
            "signatureType": "ADVANCED",
            "isSequential": true,
            "isIndexable": true
          },
          "participants": [
            {
              "role": "SIGNER",
              "firstName": "Luis",
              "lastName": "Martínez",
              "email": "luis.martinez@correo.example",
              "order": 1,
              "signaturePositions": [
                {
                  "page": 1,
                  "xRatio": 0.1,
                  "yRatio": 0.8,
                  "widthRatio": 0.25,
                  "heightRatio": 0.08
                }
              ],
              "taxId": "MAGL800101AB1"
            },
            {
              "role": "SIGNER",
              "firstName": "Marta",
              "lastName": "Gómez",
              "email": "marta.gomez@correo.example",
              "order": 2,
              "signaturePositions": [
                {
                  "page": 1,
                  "xRatio": 0.55,
                  "yRatio": 0.8,
                  "widthRatio": 0.25,
                  "heightRatio": 0.08
                }
              ]
            },
            {
              "role": "WITNESS",
              "firstName": "Eva",
              "lastName": "Ruiz",
              "email": "eva.ruiz@correo.example"
            }
          ]
        }
        ```

        Ejemplo con curl:

        ```bash
        curl -X POST https://<host>/api/v1/integration/documents \
          -H "X-API-Key: $FIRMALO_API_KEY" \
          -H "Idempotency-Key: erp-contrato-2026-000184" \
          -F "file=@contrato.pdf;type=application/pdf" \
          -F 'payload={"creator":{"email":"ana.lopez@cliente.example","firstName":"Ana","lastName":"López"},"document":{"signatureType":"SIMPLE","isSequential":true},"participants":[{"role":"SIGNER","firstName":"Luis","lastName":"Martínez","email":"luis.martinez@correo.example","order":1,"signaturePositions":[{"page":1,"xRatio":0.1,"yRatio":0.8,"widthRatio":0.25,"heightRatio":0.08}]}]}'
        ```

        Ejemplo con curl, firma avanzada con el RFC del firmante:

        ```bash
        curl -X POST https://<host>/api/v1/integration/documents \
          -H "X-API-Key: $FIRMALO_API_KEY" \
          -H "Idempotency-Key: erp-contrato-2026-000185" \
          -F "file=@contrato.pdf;type=application/pdf" \
          -F 'payload={"creator":{"email":"ana.lopez@cliente.example","firstName":"Ana","lastName":"López"},"document":{"signatureType":"ADVANCED","isSequential":true},"participants":[{"role":"SIGNER","firstName":"Luis","lastName":"Martínez","email":"luis.martinez@correo.example","order":1,"taxId":"MAGL800101AB1","signaturePositions":[{"page":1,"xRatio":0.1,"yRatio":0.8,"widthRatio":0.25,"heightRatio":0.08}]}]}'
        ```
      operationId: IntegrationDocumentsController_createDocument
      parameters:
        - name: Idempotency-Key
          in: header
          description: Valor único elegido por ti para este documento (1 a 255 caracteres ASCII visibles), por API key, durante 24 horas. Repetir la petición con la misma clave y el mismo contenido devuelve el documento original sin subir, crear, cobrar ni notificar nada.
          required: true
          schema:
            type: string
            example: erp-contrato-2026-000184
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateIntegrationDocumentDto'
            examples:
              sequential:
                summary: 'Flujo secuencial: dos firmantes y un testigo'
                value:
                  payload:
                    creator:
                      email: ana.lopez@cliente.example
                      firstName: Ana
                      lastName: López
                    document:
                      signatureType: SIMPLE
                      isSequential: true
                      isIndexable: true
                    participants:
                      - role: SIGNER
                        firstName: Luis
                        lastName: Martínez
                        email: luis.martinez@correo.example
                        order: 1
                        signaturePositions:
                          - page: 1
                            xRatio: 0.1
                            yRatio: 0.8
                            widthRatio: 0.25
                            heightRatio: 0.08
                      - role: SIGNER
                        firstName: Marta
                        lastName: Gómez
                        email: marta.gomez@correo.example
                        order: 2
                        signaturePositions:
                          - page: 1
                            xRatio: 0.55
                            yRatio: 0.8
                            widthRatio: 0.25
                            heightRatio: 0.08
                      - role: WITNESS
                        firstName: Eva
                        lastName: Ruiz
                        email: eva.ruiz@correo.example
              nonSequential:
                summary: 'Flujo no secuencial: sin `order`'
                value:
                  payload:
                    creator:
                      email: ana.lopez@cliente.example
                      firstName: Ana
                      lastName: López
                    document:
                      signatureType: SIMPLE
                      isSequential: false
                      isIndexable: true
                    participants:
                      - role: SIGNER
                        firstName: Luis
                        lastName: Martínez
                        email: luis.martinez@correo.example
                        signaturePositions:
                          - page: 1
                            xRatio: 0.1
                            yRatio: 0.8
                            widthRatio: 0.25
                            heightRatio: 0.08
                      - role: SIGNER
                        firstName: Marta
                        lastName: Gómez
                        email: marta.gomez@correo.example
                        signaturePositions:
                          - page: 1
                            xRatio: 0.55
                            yRatio: 0.8
                            widthRatio: 0.25
                            heightRatio: 0.08
                      - role: WITNESS
                        firstName: Eva
                        lastName: Ruiz
                        email: eva.ruiz@correo.example
              advanced:
                summary: 'Firma avanzada: RFC del firmante en `taxId`'
                value:
                  payload:
                    creator:
                      email: ana.lopez@cliente.example
                      firstName: Ana
                      lastName: López
                    document:
                      signatureType: ADVANCED
                      isSequential: true
                      isIndexable: true
                    participants:
                      - role: SIGNER
                        firstName: Luis
                        lastName: Martínez
                        email: luis.martinez@correo.example
                        order: 1
                        signaturePositions:
                          - page: 1
                            xRatio: 0.1
                            yRatio: 0.8
                            widthRatio: 0.25
                            heightRatio: 0.08
                        taxId: MAGL800101AB1
                      - role: SIGNER
                        firstName: Marta
                        lastName: Gómez
                        email: marta.gomez@correo.example
                        order: 2
                        signaturePositions:
                          - page: 1
                            xRatio: 0.55
                            yRatio: 0.8
                            widthRatio: 0.25
                            heightRatio: 0.08
                      - role: WITNESS
                        firstName: Eva
                        lastName: Ruiz
                        email: eva.ruiz@correo.example
      responses:
        '200':
          description: 'Repetición de una petición anterior con el mismo `Idempotency-Key`: el documento original (`Idempotent-Replayed: true`)'
          headers:
            Idempotent-Replayed:
              description: '`false` si se creó el documento; `true` si es la respuesta de una petición anterior con el mismo `Idempotency-Key`'
              schema:
                type: boolean
                example: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationCreatedDocumentResponse'
              example:
                success: true
                message: El documento ya se había creado con este Idempotency-Key
                data:
                  id: 2be3b9d7-4c5d-4e6f-8a9b-0c1d2e3f4a5b
                  status: PENDING_SIGNATURE
                  signatureType: SIMPLE
                  fileName: contrato.pdf
                  createdAt: '2026-10-26T12:00:00.000Z'
                  creator:
                    email: ana.lopez@cliente.example
                  participantsCount: 2
                  publicUrl: https://app.firmalo.com/public/documents/2be3b9d7-4c5d-4e6f-8a9b-0c1d2e3f4a5b
                  participants:
                    - email: luis.martinez@correo.example
                      status: PENDING
                      signatureType: SIMPLE
                      order: 1
                      taxId: null
        '201':
          description: Documento creado, con su URL pública de consulta
          headers:
