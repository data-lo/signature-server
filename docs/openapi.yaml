        totalPages:
          type: number
          example: 2
      required:
        - page
        - limit
        - total
        - totalPages
    IntegrationErrorData:
      type: object
      properties:
        code:
          type: string
          example: DUPLICATE_PARTICIPANT_EMAIL
          description: Código estable del error (p. ej. `PARTICIPANTS_REQUIRED`, `SIGNER_REQUIRED`, `MAX_PARTICIPANTS_EXCEEDED`, `INVALID_PARTICIPANT_ROLE`, `INVALID_PARTICIPANT_EMAIL`, `DUPLICATE_PARTICIPANT_EMAIL`, `SIGNER_SIGNATURE_POSITION_REQUIRED`, `WITNESS_SIGNATURE_POSITION_NOT_ALLOWED`, `INVALID_SIGNING_ORDER`, `DUPLICATE_SIGNING_ORDER`, `INVALID_SIGNATURE_POSITION`, `SIGNATURE_POSITION_PAGE_OUT_OF_RANGE`, `SIGNATURE_POSITION_OVERLAP`, `INVALID_PARTICIPANT_TAX_ID`, `PARTICIPANT_TAX_ID_NOT_ALLOWED`, `UNSUPPORTED_PARTICIPANT_FIELD`, `API_KEY_INVALID`, `INTERNAL_ERROR`)
        message:
          type: string
          example: Un colaborador sólo puede participar una vez en el documento.
        details:
          type: object
          example:
            field: participants[2].email
            email: ana@correo.com
          description: 'Datos del error: `field` con la ruta del campo afectado cuando aplica, y los valores que lo explican (`limit`, `received`, `page`, `totalPages`…).'
      required:
        - code
        - message
    IntegrationErrorResponseDto:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/IntegrationErrorData'
      required:
        - success
        - error
    IntegrationOrganizationContextData:
      type: object
      properties:
        organization:
          $ref: '#/components/schemas/IntegrationOrganizationData'
        signatureQuota:
          $ref: '#/components/schemas/IntegrationSignatureQuotaData'
        billing:
          $ref: '#/components/schemas/IntegrationBillingSummaryData'
      required:
        - organization
        - signatureQuota
        - billing
    IntegrationOrganizationContextResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
          description: Indica si la operación fue exitosa
        message:
          type: string
          example: Contexto de la organización obtenido correctamente
          description: Mensaje descriptivo del resultado de la operación
          enum:
            - Operación realizada con éxito
            - Recurso creado correctamente
            - Recurso no encontrado
            - Datos de entrada inválidos
            - No autorizado para realizar esta acción
            - El firmante no está asociado al recurso
            - El recurso ya existe
            - Error interno del servidor
        data:
          description: Datos de la respuesta
          allOf:
            - $ref: '#/components/schemas/IntegrationOrganizationContextData'
      required:
