          required: false
          in: query
          description: Creados desde (ISO 8601)
          schema:
            example: '2026-01-01'
            type: string
        - name: createdTo
          required: false
          in: query
          description: Creados hasta (ISO 8601)
          schema:
            example: '2026-12-31'
            type: string
