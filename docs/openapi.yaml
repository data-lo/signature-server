        - data
    IntegrationOrganizationData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 1f2e3d4c-5b6a-4978-8a9b-0c1d2e3f4a5b
        name:
          type: string
          example: Empresa Ejemplo S.A. de C.V.
          description: Razón social
        status:
          type: string
          enum:
            - active
          example: active
          description: 'Siempre `active`: una llave de una organización desactivada responde `403 API_KEY_ORGANIZATION_INACTIVE`'
      required:
        - id
        - name
        - status
    IntegrationParticipantDto:
      type: object
      properties:
        role:
          type: string
          enum:
            - SIGNER
            - WITNESS
          description: '`SIGNER` firma el documento: requiere `signaturePositions` y, si el documento es secuencial, `order`. `WITNESS` no requiere `order` ni participa en él, y no admite `signaturePositions`.'
        firstName:
          type: string
          example: Luis
          maxLength: 100
        lastName:
          type: string
          example: Martínez
          maxLength: 100
        email:
          type: string
          example: luis@correo.com
          description: 'Se compara sin espacios y en minúsculas: no puede repetirse.'
        order:
          type: integer
          minimum: 1
          example: 1
          description: 'Posición del firmante en el orden de firma: entero que inicia en 1. Obligatorio para cada `SIGNER` si `document.isSequential` es `true` o se omite. Entre los firmantes debe ser único y consecutivo, sin huecos (1, 2, 3…), y es este valor, no la posición en `participants`, lo que define el orden. Un `WITNESS` no lo requiere y no cuenta en la secuencia; con `isSequential: false` tampoco es obligatorio. Si se envía en esos casos no tiene efecto, pero debe ser un entero mayor o igual a 1.'
        signaturePositions:
          description: Obligatorio para cada SIGNER (al menos una); prohibido para un WITNESS. Ratios 0-1 de la página.
          type: array
          items:
            $ref: '#/components/schemas/SignaturePositionDto'
        requiresTwoFactorAuth:
          type: boolean
          description: Código de verificación al firmar. En SIMPLE siempre se exige; en ADVANCED y BIOMETRIC, sólo si es true.
        taxId:
          type: string
          example: LOPA800101AB1
          minLength: 12
          maxLength: 13
          pattern: ^[A-ZÑ&]{3,4}\d{6}[A-Z\d]{3}$
          description: 'RFC mexicano del firmante: 13 caracteres para persona física o 12 para persona moral (3 o 4 letras, fecha AAMMDD y homoclave de 3). Se quitan los espacios y se pasa a mayúsculas. Sólo se admite en un participante con `role: SIGNER` de un documento con `document.signatureType: ADVANCED`; en cualquier otro caso la respuesta es `422 PARTICIPANT_TAX_ID_NOT_ALLOWED`, y con un formato inválido, `422 INVALID_PARTICIPANT_TAX_ID`. Si viene, el titular del certificado de su e.firma tiene que tener exactamente ese RFC; si no viene, se compara el nombre del colaborador con el del certificado.'
      required:
        - role
        - firstName
        - lastName
        - email
    IntegrationResentInvitationData:
      type: object
      properties:
        email:
          type: string
          example: ana@correo.com
          description: Correo del firmante al que se reenvió la invitación
        invitationExpiresAt:
          format: date-time
          type: string
          example: '2026-11-02T12:00:00.000Z'
          description: Vencimiento de la invitación nueva
        emailDelivered:
          type: boolean
          example: true
          description: '`false` si la invitación se emitió pero el correo no se pudo entregar; se puede reintentar más tarde'
      required:
        - email
        - invitationExpiresAt
        - emailDelivered
    IntegrationResentInvitationResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
          description: Indica si la operación fue exitosa
        message:
          type: string
          example: Invitación reenviada al correo del firmante
          description: Mensaje descriptivo del resultado de la operación
          enum:
            - Operación realizada con éxito
            - Recurso creado correctamente
            - Recurso no encontrado
            - Datos de entrada inválidos
            - No autorizado para realizar esta acción
            - El firmante no está asociado al recurso
            - El recurso ya existe
            - Error interno del servidor
        data:
          description: Datos de la respuesta
          allOf:
            - $ref: '#/components/schemas/IntegrationResentInvitationData'
      required:
        - success
        - message
        - data
    IntegrationSignatureQuotaData:
      type: object
      properties:
        planLimit:
          type: number
          example: 1000
          description: Documentos que incluye el periodo vigente del plan
        documentsSigned:
          type: number
          example: 725
          description: Documentos que terminaron de firmarse durante el periodo vigente; `0` si no hay periodo vigente
        documentsRemaining:
          type: number
          example: 275
          description: 'Documentos que todavía se pueden crear para firma: suma los créditos vigentes del plan, los arrastrados y los comprados aparte, así que puede superar a `planLimit`. Un crédito se consume al crear el documento, no al firmarlo, por lo que no equivale a `planLimit - documentsSigned`. `0` si se agotó.'
        periodStart:
          type: string
          format: date
          nullable: true
          example: '2026-11-01'
          description: Primer día del periodo vigente (UTC)
        periodEnd:
          type: string
          format: date
          nullable: true
          example: '2026-11-30'
          description: Último día cubierto por el periodo vigente (UTC)
      required:
        - planLimit
        - documentsSigned
        - documentsRemaining
        - periodStart
        - periodEnd
    IntegrationSigningAccessData:
